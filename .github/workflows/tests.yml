name: Tests

"on":
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-checks:
    name: Repository source checks (partial OSPS evidence)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML parser
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Check source artifacts and workflow policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/check_source_policy.py
          python3 -m unittest discover -s tests/source_policy -v

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible Lint
        run: >-
          python -m pip install
          'ansible-core==2.16.14'
          'ansible-lint==25.5.0'

      - name: Run production-profile Ansible Lint
        env:
          ANSIBLE_ROLES_PATH: ..
        run: ansible-lint --profile production

      - name: Lint mail-flow Molecule playbooks
        env:
          ANSIBLE_ROLES_PATH: ..
        run: ansible-lint --profile production molecule/mail-flow/verify.yml molecule/mail-flow/converge.yml

  molecule:
    name: Molecule (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
          - rocky10
          - ubi9
          - ubi10
          - validation
          - lifecycle
          - lmdb
          - mail-flow

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Configure Podman storage for GitHub runner
        run: |
          mkdir -p "$HOME/.config/containers"
          printf '%s\n' '[storage]' 'driver = "vfs"' > "$HOME/.config/containers/storage.conf"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and Ansible
        run: >-
          python -m pip install
          'ansible-core==2.16.14'
          'molecule==6.0.3'
          'molecule-plugins[podman]==23.5.0'

      - name: Run Molecule scenario
        env:
          ANSIBLE_ROLES_PATH: ..
        run: molecule test -s "${{ matrix.scenario }}"
