---
###############################################################################
#
# DEFAULT CONFIGURATION FOR THE ROLE
#
# Warning! Do not edit this file but set configuration in inventory,
# playbook or as commandline parameter with ansible-playbook command
#
###############################################################################

###############################################################################
# ENVIRONMENT CONFIGURATION
###############################################################################

http_proxy: ""
https_proxy: ""
no_proxy: ""

###############################################################################
# SUPPORTED TARGET OPERATING SYSTEMS
###############################################################################

iac_supported_os:
  - { name: "Rocky", versions: ["9", "10"] }
  - { name: "RedHat", versions: ["9", "10"] }

###############################################################################
# DNF CONFIGURATION
###############################################################################

dnf_sslverify: true
dnf_validate_certs: true
dnf_disable_gpg_check: false
dnf_update_cache: true

###############################################################################
# ANSIBLE LOG
###############################################################################

iac_service_name: "postfix"
iac_ansible_report: true
iac_ansible_report_tasks_path: "/root/ansible-report-tasks.log"

###############################################################################
# POSTFIX CONFIGURATION
###############################################################################

postfix_package: "postfix"
postfix_service_name: "postfix"
postfix_etc_directory: "/etc/postfix"
postfix_main_cf_path: "/etc/postfix/main.cf"
postfix_virtual_alias_maps_path: "/etc/postfix/virtual"
postfix_virtual_alias_maps_db_path: "/etc/postfix/virtual.db"
postfix_virtual_alias_maps_lmdb_path: "/etc/postfix/virtual.lmdb"
postfix_virtual_alias_maps_type: "auto"
postfix_virtual_mailbox_maps_path: "/etc/postfix/vmailbox"
postfix_virtual_mailbox_maps_db_path: "/etc/postfix/vmailbox.db"
postfix_virtual_mailbox_maps_lmdb_path: "/etc/postfix/vmailbox.lmdb"
postfix_relay_recipient_maps_path: "/etc/postfix/relay_recipients"
postfix_relay_recipient_maps_db_path: "/etc/postfix/relay_recipients.db"
postfix_relay_recipient_maps_lmdb_path: "/etc/postfix/relay_recipients.lmdb"
postfix_transport_maps_path: "/etc/postfix/transport"
postfix_transport_maps_db_path: "/etc/postfix/transport.db"
postfix_transport_maps_lmdb_path: "/etc/postfix/transport.lmdb"
postfix_virtual_mailbox_base: "/var/vmail"
postfix_vmail_group_name: "vmail"
postfix_vmail_group_gid: 5000
postfix_vmail_user_name: "vmail"
postfix_vmail_user_uid: 5000

postfix_default_inet_interfaces: "all"
postfix_default_inet_protocols: "all"
postfix_default_mydestination:
  - "$myhostname"
  - "localhost.$mydomain"
  - "localhost"
postfix_default_mynetworks:
  - "127.0.0.0/8"
  - "[::1]/128"
postfix_default_smtpd_recipient_restrictions:
  - "permit_mynetworks"
  - "reject_unauth_destination"
