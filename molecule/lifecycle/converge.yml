---
- name: "Exercise Postfix lifecycle and targeted states"
  hosts: all
  become: false
  vars:
    state: install
    ansible_become_method: su
    iac_blueprint:
      postfix:
        configuration:
          myhostname: "mx.lifecycle.example.org"
          mydomain: "lifecycle.example.org"
          inet_protocols: "ipv4"
        virtual_mailbox_domains:
          - name: "lifecycle.example.org"
            mailboxes:
              - user: "info"
        virtual_aliases:
          - source: "postmaster@lifecycle.example.org"
            destination: "info@lifecycle.example.org"
  pre_tasks:
    - name: "Installing netcat for lifecycle fixtures"
      ansible.builtin.dnf:
        name: nmap-ncat
        state: present
  roles:
    - role: ansible-iac-role-postfix
  tasks:
    - name: "Adding a targeted virtual alias"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
      vars:
        state: virtual_alias_present
        iac_blueprint:
          postfix:
            virtual_alias_targets:
              - source: "ops@lifecycle.example.org"
                destination: "info@lifecycle.example.org"

    - name: "Checking targeted virtual alias was added"
      ansible.builtin.command: grep -F "ops@lifecycle.example.org info@lifecycle.example.org" /etc/postfix/virtual
      changed_when: false

    - name: "Removing the targeted virtual alias"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
      vars:
        state: virtual_alias_absent
        iac_blueprint:
          postfix:
            virtual_alias_targets:
              - source: "ops@lifecycle.example.org"
                destination: "info@lifecycle.example.org"

    - name: "Checking targeted virtual alias was removed"
      ansible.builtin.command: grep -F "ops@lifecycle.example.org info@lifecycle.example.org" /etc/postfix/virtual
      register: postfix_alias_absent_check
      changed_when: false
      failed_when: false

    - name: "Asserting targeted virtual alias removal"
      ansible.builtin.assert:
        that:
          - postfix_alias_absent_check.rc != 0

    - name: "Adding a targeted virtual mailbox"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
      vars:
        state: virtual_mailbox_present
        iac_fs_files:
          - path: "/tmp/postfix-shared-leak-sentinel"
            content: "shared filesystem leak sentinel\n"
        iac_blueprint:
          postfix:
            virtual_mailbox_targets:
              - domain: "lifecycle.example.org"
                user: "targeted"

    - name: "Checking targeted virtual mailbox was added"
      ansible.builtin.stat:
        path: /var/vmail/lifecycle.example.org/targeted/new
      register: postfix_mailbox_present_check

    - name: "Asserting targeted virtual mailbox creation"
      ansible.builtin.assert:
        that:
           - postfix_mailbox_present_check.stat.isdir

    - name: "Checking shared filesystem file records remain isolated"
      ansible.builtin.stat:
        path: /tmp/postfix-shared-leak-sentinel
      register: postfix_shared_leak_sentinel

    - name: "Asserting shared filesystem file records were not consumed"
      ansible.builtin.assert:
        that:
          - not postfix_shared_leak_sentinel.stat.exists

    - name: "Rejecting traversal in the mailbox removal base"
      block:
        - name: "Attempting mailbox removal with a traversal base"
          ansible.builtin.include_role:
            name: ansible-iac-role-postfix
          vars:
            state: virtual_mailbox_absent
            postfix_virtual_mailbox_base: "/var/vmail/../etc"
            iac_blueprint:
              postfix:
                virtual_mailbox_targets:
                  - domain: "lifecycle.example.org"
                    user: "traversal"
        - ansible.builtin.fail:
            msg: "Mailbox traversal removal was accepted"
      rescue:
        - ansible.builtin.assert:
            that:
              - (ansible_failed_result | to_json) is search("Postfix path postfix_virtual_mailbox_base must be an absolute path other than /")

    - name: "Creating disposable symlink sentinel file"
      ansible.builtin.copy:
        content: "postfix symlink sentinel\n"
        dest: "/tmp/postfix-symlink-sentinel"
        mode: "0600"

    - name: "Creating a symlink in the mailbox removal path"
      ansible.builtin.file:
        src: /tmp/postfix-symlink-sentinel
        dest: /var/vmail/lifecycle.example.org/symlinked
        state: link

    - name: "Rejecting mailbox removal through a symlink"
      block:
        - name: "Attempting symlink mailbox removal"
          ansible.builtin.include_role:
            name: ansible-iac-role-postfix
          vars:
            state: virtual_mailbox_absent
            iac_blueprint:
              postfix:
                virtual_mailbox_targets:
                  - domain: "lifecycle.example.org"
                    user: "symlinked"
        - ansible.builtin.fail:
            msg: "Mailbox symlink removal was accepted"
      rescue:
        - ansible.builtin.assert:
            that:
              - (ansible_failed_result | to_json) is search("Refusing to remove mailbox path through a symlink")

    - name: "Removing the mailbox path symlink fixture"
      ansible.builtin.file:
        path: /var/vmail/lifecycle.example.org/symlinked
        state: absent

    - name: "Removing disposable symlink sentinel file"
      ansible.builtin.file:
        path: "/tmp/postfix-symlink-sentinel"
        state: absent

    - name: "Creating disposable intermediate symlink sentinel file"
      ansible.builtin.copy:
        content: "postfix intermediate symlink sentinel\n"
        dest: "/tmp/postfix-intermediate-symlink-sentinel"
        mode: "0600"

    - name: "Creating an intermediate mailbox path symlink fixture"
      ansible.builtin.file:
        src: /tmp/postfix-intermediate-symlink-sentinel
        dest: /var/vmail/lifecycle.example.org/intermediate
        state: link

    - name: "Rejecting mailbox removal through an intermediate symlink"
      block:
        - name: "Attempting intermediate symlink mailbox removal"
          ansible.builtin.include_role:
            name: ansible-iac-role-postfix
          vars:
            state: virtual_mailbox_absent
            iac_blueprint:
              postfix:
                virtual_mailbox_targets:
                  - domain: "lifecycle.example.org"
                    user: "intermediate"
        - ansible.builtin.fail:
            msg: "Intermediate mailbox symlink removal was accepted"
      rescue:
        - ansible.builtin.assert:
            that:
              - (ansible_failed_result | to_json) is search("Refusing to remove mailbox path through a symlink")

    - name: "Removing the intermediate mailbox path symlink fixture"
      ansible.builtin.file:
        path: /var/vmail/lifecycle.example.org/intermediate
        state: absent

    - name: "Removing disposable intermediate symlink sentinel file"
      ansible.builtin.file:
        path: "/tmp/postfix-intermediate-symlink-sentinel"
        state: absent

    - name: "Removing the targeted virtual mailbox"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
      vars:
        state: virtual_mailbox_absent
        iac_fs_files:
          - path: "/tmp/postfix-shared-leak-sentinel-absent"
            content: "shared filesystem absent-state leak sentinel\n"
        iac_blueprint:
          postfix:
            virtual_mailbox_targets:
              - domain: "lifecycle.example.org"
                user: "targeted"

    - name: "Checking targeted virtual mailbox was removed"
      ansible.builtin.stat:
        path: /var/vmail/lifecycle.example.org/targeted
      register: postfix_mailbox_absent_check

    - name: "Asserting targeted virtual mailbox removal"
      ansible.builtin.assert:
        that:
          - not postfix_mailbox_absent_check.stat.exists

    - name: "Checking absent-state shared filesystem file records remain isolated"
      ansible.builtin.stat:
        path: /tmp/postfix-shared-leak-sentinel-absent
      register: postfix_shared_leak_absent_sentinel

    - name: "Asserting absent-state shared filesystem file records were not consumed"
      ansible.builtin.assert:
        that:
          - not postfix_shared_leak_absent_sentinel.stat.exists

    - name: "Stopping Postfix"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
      vars:
        state: stopped

    - name: "Checking Postfix is stopped"
      ansible.builtin.command: systemctl is-active postfix
      register: postfix_stopped_check
      changed_when: false
      failed_when: false

    - name: "Asserting stopped state"
      ansible.builtin.assert:
        that:
          - postfix_stopped_check.rc != 0

    - name: "Starting Postfix"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
      vars:
        state: started

    - name: "Restarting Postfix"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
      vars:
        state: restarted

    - name: "Checking Postfix is active after restart"
      ansible.builtin.command: systemctl is-active postfix
      register: postfix_restarted_check
      changed_when: false

    - name: "Asserting restarted state"
      ansible.builtin.assert:
        that:
          - postfix_restarted_check.stdout == 'active'

    - name: "Removing Postfix installation"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
      vars:
        state: absent

    - name: "Checking Postfix package is absent"
      ansible.builtin.command: rpm -q postfix
      register: postfix_package_absent_check
      changed_when: false
      failed_when: false

    - name: "Asserting absent state"
      ansible.builtin.assert:
        that:
          - postfix_package_absent_check.rc != 0

    - name: "Uninstalling Postfix idempotently"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
      vars:
        state: uninstall

    - name: "Checking Postfix package remains absent after uninstall"
      ansible.builtin.command: rpm -q postfix
      register: postfix_package_uninstall_check
      changed_when: false
      failed_when: false

    - name: "Asserting uninstall state"
      ansible.builtin.assert:
        that:
          - postfix_package_uninstall_check.rc != 0
