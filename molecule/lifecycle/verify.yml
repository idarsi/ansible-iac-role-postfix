---
- name: "Verify Postfix lifecycle"
  hosts: all
  become: false
  tasks:
    - name: "Checking Postfix package was restored by omitted-state recovery"
      ansible.builtin.command: rpm -q postfix
      register: postfix_package_check
      changed_when: false
      failed_when: false

    - name: "Verifying final lifecycle state"
      ansible.builtin.assert:
        that:
          - postfix_package_check.rc == 0
        fail_msg: "Omitted state did not restore the Postfix package"
