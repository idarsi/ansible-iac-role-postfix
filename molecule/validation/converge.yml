            mode: "0644"

- name: "Reject unsafe Postfix domain value"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postfix:
        virtual_mailbox_domains:
          - name: ".."
  tasks:
    - name: "Running validation expecting unsafe domain failure"
      block:
        - ansible.builtin.include_role:
            name: ansible-iac-role-postfix
        - ansible.builtin.fail:
            msg: "Unsafe Postfix values were accepted"
      rescue:
        - name: "Checking unsafe domain failure"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results[0].msg == "Each Postfix domain record requires a valid domain name"
        - name: "Writing unsafe-domain marker"
          ansible.builtin.copy:
            dest: /tmp/postfix-validation-unsafe-domain.ok
            content: "ok\n"
            mode: "0644"

- name: "Reject relative Postfix managed path"
  hosts: all
  become: false
  vars:
    state: validate
    postfix_etc_directory: "etc/postfix"
    iac_blueprint:
      postfix: {}
  tasks:
    - name: "Running validation expecting relative path failure"
      block:
        - name: "Applying relative Postfix managed path"
          ansible.builtin.include_role:
            name: ansible-iac-role-postfix
        - name: "Failing if relative managed path was accepted"
          ansible.builtin.fail:
            msg: "Relative Postfix managed path was accepted"
      rescue:
        - name: "Checking relative path failure message"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results[0].msg == "Postfix path postfix_etc_directory must be an absolute path other than /"
        - name: "Writing relative-path marker"
          ansible.builtin.copy:
            dest: /tmp/postfix-validation-relative-path.ok
            content: "ok\n"
            mode: "0644"

- name: "Reject unsupported Postfix backend"
  hosts: all
  become: false
  vars:
    state: validate
    postfix_maps_type: "unsupported-lmdb"
    iac_blueprint:
      postfix:
        configuration:
          extra_parameters:
            smtpd_banner: "safe"
  tasks:
    - name: "Running validation expecting backend failure"
      block:
        - ansible.builtin.include_role:
            name: ansible-iac-role-postfix
        - ansible.builtin.fail:
            msg: "Unsupported backend was accepted"
      rescue:
        - name: "Checking backend failure"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == "postfix_maps_type (or legacy postfix_virtual_alias_maps_type) must be one of auto, hash, or lmdb"
        - name: "Writing backend marker"
          ansible.builtin.copy:
            dest: /tmp/postfix-validation-backend.ok
            content: "ok\n"
            mode: "0644"

- name: "Reject newline in a Postfix configuration value"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postfix:
        configuration:
          myhostname: "bad\nvalue"
  tasks:
    - name: "Running validation expecting newline failure"
      block:
        - ansible.builtin.include_role:
            name: ansible-iac-role-postfix
        - ansible.builtin.fail:
            msg: "Newline value was accepted"
      rescue:
        - name: "Checking newline failure"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == "Postfix scalar configuration fields must be strings without control characters"
        - name: "Writing newline marker"
          ansible.builtin.copy:
            dest: /tmp/postfix-validation-newline.ok
            content: "ok\n"
            mode: "0644"

- name: "Reject tab in extra_parameters"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postfix:
        configuration:
          extra_parameters: {smtpd_banner: "bad\tvalue"}
  tasks:
    - name: "Validate tab control character"
      block:
        - ansible.builtin.include_role:
            name: ansible-iac-role-postfix
        - ansible.builtin.fail:
            msg: "Tab was accepted"
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.results[0].msg == "extra_parameters keys and values must not contain ASCII control characters"
        - name: "Writing tab marker"
          ansible.builtin.copy:
            dest: /tmp/postfix-validation-tab.ok
            content: "ok\n"
            mode: "0644"

