- name: "Accept case-only scoped and top-level mailbox domain reuse"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postfix:
        virtual_mailbox_domains:
          - name: "Collision.example.org"
        virtual_mailboxes:
          - address: "archive@COLLISION.example.org"
            path: "collision/archive/"
  tasks:
    - name: "Validate mailbox domain reuse"
      ansible.builtin.include_role:
        name: ansible-iac-role-postfix
    - name: "Writing mailbox domain reuse marker"
      ansible.builtin.copy:
        dest: /tmp/postfix-validation-mailbox-domain-reuse.ok
        content: "ok\n"
        mode: "0644"

- name: "Reject case-only duplicate alias source"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postfix:
        virtual_aliases:
          - {source: "Admin@Example.org", destination: "root"}
          - {source: "admin@example.org", destination: "root"}
  tasks:
    - name: "Validate duplicate alias source"
      block:
        - ansible.builtin.include_role:
            name: ansible-iac-role-postfix
        - ansible.builtin.fail:
            msg: "Duplicate alias source was accepted"
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == "Postfix virtual alias sources and mailbox addresses must be unique"

- name: "Reject case-only duplicate mailbox address"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postfix:
        virtual_mailboxes:
          - {address: "Archive@Example.org", path: "example/archive/"}
          - {address: "archive@example.org", path: "example/archive2/"}
  tasks:
    - name: "Validate duplicate mailbox address"
      block:
        - ansible.builtin.include_role:
            name: ansible-iac-role-postfix
        - ansible.builtin.fail:
            msg: "Duplicate mailbox address was accepted"
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg == "Postfix virtual alias sources and mailbox addresses must be unique"

- name: "Reject whitespace protected extra parameter key"
  hosts: all
  become: false
  vars:
    state: validate
    iac_blueprint:
      postfix:
        configuration:
          extra_parameters:
            "mynetworks ": "0.0.0.0/0"
  tasks:
    - name: "Validate whitespace protected key"
      block:
        - ansible.builtin.include_role:
            name: ansible-iac-role-postfix
        - ansible.builtin.fail:
            msg: "Whitespace protected key was accepted"
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.results[0].msg == "extra_parameters cannot override managed or safety-critical main.cf key 'mynetworks '"
        - name: "Writing whitespace-key marker"
          ansible.builtin.copy:
            dest: /tmp/postfix-validation-whitespace-key.ok
            content: "ok\n"
            mode: "0644"
