---
###############################################################################
#
# main.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# CHECKING REQUIREMENTS
###############################################################################

- name: "Checking if operating system is supported"
  ansible.builtin.fail:
    msg: "Unsupported operating system: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
  when: >
    iac_supported_os | selectattr('name', 'equalto', ansible_facts['distribution'])
                     | selectattr('versions', 'contains', ansible_facts['distribution_major_version'])
                     | list
                     | length == 0

- name: "Checking if service_key is found from variables"
  ansible.builtin.fail:
    msg: "iac_blueprint or iac_blueprint.postfix is not defined"
  when: iac_blueprint is not defined or iac_blueprint.postfix is not defined

###############################################################################
# SETTING VARIABLES
###############################################################################

- name: "Setting what Postfix configuration is to be managed"
  ansible.builtin.set_fact:
    postfix_configuration: "{{ iac_blueprint.postfix.configuration | default({}) }}"
    postfix_virtual_domains: "{{ iac_blueprint.postfix.virtual_domains | default([]) }}"
    postfix_virtual_aliases: "{{ iac_blueprint.postfix.virtual_aliases | default([]) }}"
    postfix_virtual_mailboxes: "{{ iac_blueprint.postfix.virtual_mailboxes | default([]) }}"
    postfix_virtual_domain_targets_raw: "{{ iac_blueprint.postfix.virtual_domain_targets | default([]) }}"
    postfix_virtual_alias_targets_raw: "{{ iac_blueprint.postfix.virtual_alias_targets | default([]) }}"
    postfix_virtual_mailbox_targets_raw: "{{ iac_blueprint.postfix.virtual_mailbox_targets | default([]) }}"

- name: "Normalizing Postfix virtual targets"
  ansible.builtin.set_fact:
    postfix_virtual_domain_targets: >-
      {{
        postfix_virtual_domain_targets_raw
        if (
          postfix_virtual_domain_targets_raw is sequence
          and postfix_virtual_domain_targets_raw is not string
        )
        else (
          (postfix_virtual_domain_targets_raw | from_yaml)
          if (
            postfix_virtual_domain_targets_raw is string
            and postfix_virtual_domain_targets_raw | trim | length > 0
          )
          else []
        )
      }}
    postfix_virtual_alias_targets: >-
      {{
        postfix_virtual_alias_targets_raw
        if (
          postfix_virtual_alias_targets_raw is sequence
          and postfix_virtual_alias_targets_raw is not string
        )
        else (
          (postfix_virtual_alias_targets_raw | from_yaml)
          if (
            postfix_virtual_alias_targets_raw is string
            and postfix_virtual_alias_targets_raw | trim | length > 0
          )
          else []
        )
      }}
    postfix_virtual_mailbox_targets: >-
      {{
        postfix_virtual_mailbox_targets_raw
        if (
          postfix_virtual_mailbox_targets_raw is sequence
          and postfix_virtual_mailbox_targets_raw is not string
        )
        else (
          (postfix_virtual_mailbox_targets_raw | from_yaml)
          if (
            postfix_virtual_mailbox_targets_raw is string
            and postfix_virtual_mailbox_targets_raw | trim | length > 0
          )
          else []
        )
      }}

- name: "Checking proxy address if it's defined"
  ansible.builtin.set_fact:
    proxy_host: "{{ (http_proxy | regex_replace('^https?://', '')).split(':')[0] }}"
    proxy_port: "{{ (http_proxy | regex_replace('^https?://', '')).split(':')[1] | int }}"
  when: >
    (
      (http_proxy is defined and http_proxy != "")
      or (https_proxy is defined and https_proxy != "")
    )
    and (inventory_hostname not in (no_proxy | default("") | split(",")))

- name: "Checking that proxy connection is working if it's defined"
  ansible.builtin.wait_for:
    host: "{{ proxy_host }}"
    port: "{{ proxy_port }}"
    state: "started"
    timeout: 3
  when: >
    (
      (http_proxy is defined and http_proxy != "")
      or (https_proxy is defined and https_proxy != "")
    )
    and (inventory_hostname not in (no_proxy | default("") | split(",")))

###############################################################################
# CHECKING STATES
###############################################################################

- name: "STATE: Ensure Postfix installation and configuration is present"
  ansible.builtin.include_tasks: install.yml
  when: state == 'install'

- name: "STATE: Ensure Postfix installation and configuration is absent"
  ansible.builtin.include_tasks: uninstall.yml
  when: state == 'uninstall'

- name: "STATE: Ensure Postfix installation is present"
  ansible.builtin.include_tasks: present.yml
  when: state == 'present'

- name: "STATE: Ensure Postfix installation is absent"
  ansible.builtin.include_tasks: absent.yml
  when: state == 'absent'

- name: "STATE: Ensure Postfix configuration is present"
  ansible.builtin.include_tasks: configuration_present.yml
  when: state == 'configuration_present'

- name: "STATE: Ensure Postfix virtual domain entries are present"
  ansible.builtin.include_tasks: virtual_domain_present.yml
  when: state == 'virtual_domain_present'

- name: "STATE: Ensure Postfix virtual domain entries are absent"
  ansible.builtin.include_tasks: virtual_domain_absent.yml
  when: state == 'virtual_domain_absent'

- name: "STATE: Ensure Postfix virtual alias entries are present"
  ansible.builtin.include_tasks: virtual_alias_present.yml
  when: state == 'virtual_alias_present'

- name: "STATE: Ensure Postfix virtual alias entries are absent"
  ansible.builtin.include_tasks: virtual_alias_absent.yml
  when: state == 'virtual_alias_absent'

- name: "STATE: Ensure Postfix virtual mailbox entries are present"
  ansible.builtin.include_tasks: virtual_mailbox_present.yml
  when: state == 'virtual_mailbox_present'

- name: "STATE: Ensure Postfix virtual mailbox entries are absent"
  ansible.builtin.include_tasks: virtual_mailbox_absent.yml
  when: state == 'virtual_mailbox_absent'

- name: "STATE: Ensure Postfix is started"
  ansible.builtin.include_tasks: started.yml
  when: state == 'started'

- name: "STATE: Ensure Postfix is stopped"
  ansible.builtin.include_tasks: stopped.yml
  when: state == 'stopped'

- name: "STATE: Ensure Postfix is restarted"
  ansible.builtin.include_tasks: restarted.yml
  when: state == 'restarted'
